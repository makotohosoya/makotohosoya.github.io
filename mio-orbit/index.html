<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mio Orbit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view" aria-label="探査機みおの航跡。画面に触れると、信号が地球から水星へ旅をします"></canvas>

  </script>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
